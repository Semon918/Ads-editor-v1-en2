<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Upgrade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: clamp(36px, 7vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
    }

    p {
      margin: 0;
      color: #aeb4c0;
      font-size: clamp(16px, 2vw, 21px);
    }

    .loader {
      width: 46px;
      height: 46px;
      margin: 30px auto 0;
      border: 4px solid #30343d;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>This Site Under Upgrade</h1>
    <p>Please check back soon.</p>
    <div class="loader"></div>
  </div>
</body>
</html>

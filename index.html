<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05091d">
<title>Upgrading — Back Soon</title>
<style>
  :root { color-scheme: dark; --cyan:#16d9ff; --blue:#2878ff; --purple:#b23cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 30%, #10194b 0%, #080d29 42%, #030611 100%);
    color: #f7f8ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body::before, body::after {
    content:""; position:fixed; pointer-events:none; width:80vw; height:40vh; bottom:-18vh;
    border-radius:50%; filter:blur(2px); opacity:.65;
    background: repeating-radial-gradient(ellipse at center, transparent 0 13px, #087cff55 14px 15px, transparent 16px 25px);
    transform: rotate(-12deg); animation: wave 9s ease-in-out infinite alternate;
  }
  body::after { right:-28vw; bottom:-20vh; opacity:.5; background:repeating-radial-gradient(ellipse at center, transparent 0 15px, #a12dff66 16px 17px, transparent 18px 29px); transform:rotate(14deg); animation-delay:-4s; }
  .stars { position:fixed; inset:0; pointer-events:none; background-image:radial-gradient(#29dfff 1px, transparent 1.5px),radial-gradient(#874dff 1px,transparent 1.5px); background-size:87px 91px,131px 127px; background-position:12px 22px,55px 43px; opacity:.24; }
  main { position:relative; z-index:1; width:min(900px, 92vw); text-align:center; padding:48px 20px 54px; }
  .icon-wrap { width:190px; height:170px; margin:0 auto 12px; position:relative; display:grid; place-items:center; }
  .orbit { position:absolute; width:190px; height:58px; border:2px solid #763dff; border-radius:50%; transform:rotate(-12deg); box-shadow:0 0 20px #7c39ff77; animation:orbit 5s linear infinite; }
  .orbit.two { width:160px; height:44px; border-color:#00cfff; transform:rotate(18deg); animation-direction:reverse; }
  .gear { width:105px; height:105px; color:#a9f2ff; filter:drop-shadow(0 0 14px #168fff); animation:float 3s ease-in-out infinite; }
  .arrow { position:absolute; bottom:8px; width:58px; height:80px; color:#13e4ff; filter:drop-shadow(0 0 12px #007dff); }
  h1 { font-size:clamp(3.2rem, 10vw, 6.4rem); letter-spacing:-.065em; line-height:1; margin:8px 0 18px; font-weight:850; background:linear-gradient(100deg,#fff 18%,#a8eaff 53%,#b14aff 88%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lead { font-size:clamp(1.1rem,2.5vw,1.5rem); margin:0 0 12px; }
  .description { color:#b8c3df; line-height:1.7; max-width:660px; margin:0 auto; font-size:1rem; }
  .progress-row { display:flex; gap:16px; align-items:center; max-width:610px; margin:34px auto 0; }
  .track { height:15px; flex:1; background:#151b3c; border:1px solid #343d6a; border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 8px #0008; }
  .fill { height:100%; width:70%; border-radius:inherit; background:linear-gradient(90deg,#08dfff,#287cff 55%,#d53cff); box-shadow:0 0 18px #2c7dff; animation:shine 2.6s linear infinite; background-size:200% 100%; }
  .percent { font-size:1.1rem; font-weight:700; min-width:46px; }
  .features { display:flex; align-items:center; justify-content:center; gap:0; margin:42px auto 0; max-width:690px; }
  .feature { flex:1; display:flex; gap:12px; align-items:center; justify-content:center; padding:0 18px; min-height:58px; text-align:left; }
  .feature + .feature { border-left:1px solid #283157; }
  .feature-icon { display:grid; place-items:center; width:48px; height:48px; flex:0 0 48px; border-radius:14px; color:var(--cyan); border:1px solid #1264b7; background:#071b3c; box-shadow:0 0 20px #007bff20 inset; }
  .feature:nth-child(2) .feature-icon { color:#bf5cff; border-color:#6230a1; background:#1a1036; }
  .feature:nth-child(3) .feature-icon { color:#13e4ff; border-color:#08749c; }
  .feature svg { width:24px; height:24px; }
  .feature span { font-size:.92rem; font-weight:650; line-height:1.35; }
  .foot { margin-top:42px; color:#7886ae; font-size:.85rem; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes orbit { to{transform:rotate(348deg)} }
  @keyframes shine { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  @keyframes wave { from{transform:translateX(-2%) rotate(-12deg)} to{transform:translateX(3%) rotate(-7deg)} }
  @media(max-width:600px) {
    main { padding:34px 10px 38px; }
    .icon-wrap { transform:scale(.86); margin-bottom:0; }
    .features { flex-direction:column; align-items:stretch; gap:18px; margin-top:34px; max-width:260px; }
    .feature { justify-content:flex-start; padding:0; }
    .feature + .feature { border-left:0; }
    .progress-row { margin-top:28px; }
  }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <div class="icon-wrap" aria-hidden="true">
    <div class="orbit"></div><div class="orbit two"></div>
    <svg class="gear" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
      <path d="M42 3h16l3 12a37 37 0 0 1 8 3l10-7 11 11-7 10a37 37 0 0 1 3 8l12 3v16l-12 3a37 37 0 0 1-3 8l7 10-11 11-10-7a37 37 0 0 1-8 3l-3 12H42l-3-12a37 37 0 0 1-8-3l-10 7-11-11 7-10a37 37 0 0 1-3-8L2 58V42l12-3a37 37 0 0 1 3-8l-7-10 11-11 10 7a37 37 0 0 1 8-3z" transform="translate(0 -2) scale(.98)"/>
      <circle cx="50" cy="48" r="23" fill="#071333" stroke="#39caff" stroke-width="4"/>
      <circle cx="50" cy="48" r="13" fill="none" stroke="#277cff" stroke-width="3"/>
    </svg>
    <svg class="arrow" viewBox="0 0 60 85" fill="currentColor"><path d="M30 0 57 30H42v55H18V30H3z"/></svg>
  </div>
  <h1>Upgrading</h1>
  <p class="lead">We’re upgrading our website to serve you better.</p>
  <p class="description">We’re working on exciting improvements to give you a faster, smoother and more powerful experience. Please check back soon!</p>
  <div class="progress-row" aria-label="Upgrade progress: 70 percent">
    <div class="track"><div class="fill"></div></div><span class="percent">70%</span>
  </div>
  <section class="features" aria-label="What's improving">
    <div class="feature">
      <div class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.9h-3l-.3-1.9a8 8 0 0 1-1.8-1l-1.7.7-1.5-2.6 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.8-1l.3-1.9h3l.3 1.9a8 8 0 0 1 1.8 1l1.7-.7 1.5 2.6-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1)"/></svg></div>
      <span>Better<br>Performance</span>
    </div>
    <div class="feature">
      <div class="feature-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 1.8 4.5 13a1 1 0 0 0 .8 1.6h5.2l-.8 7.6 9.8-12.4a1 1 0 0 0-.8-1.6h-5.4z"/></svg></div>
      <span>New<br>Features</span>
    </div>
  </section>
  <p class="foot">Thank you for your patience. We’ll be back soon.</p>
</main>
</body>
</html>
